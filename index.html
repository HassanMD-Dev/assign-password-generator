<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h2>Password Generator</h2>
      <div class="card">
        <input
          type="text"
          name="text"
          id="showPass"
          placeholder="Generated Password"
        />
        <div class="length-box">
          <label for="length" class="label">Password Length</label>
          <input type="number" id="length" min="4" max="20" value="12" />
        </div>
        <div class="option">
          <input type="checkbox" name="upper" id="upper" />
          <label for="upper" class="label">Uppercase</label>
        </div>
        <div class="option">
          <input type="checkbox" name="lower" id="lower" />
          <label for="lower" class="label">Lowercase</label>
        </div>
        <div class="option">
          <input type="checkbox" name="number" id="number" />
          <label for="number" class="label">Numbers</label>
        </div>
        <div class="option">
          <input type="checkbox" name="symbol" id="symbol" />
          <label for="symbol" class="label">Symbols</label>
        </div>
        <button type="submit" id="generatePass">Generate Password</button>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
